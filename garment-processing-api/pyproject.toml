[project]
name = "garment-processing-api"
version = "0.1.0"
description = "FastAPI garment extraction and virtual try-on backend"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "cloudinary",
    "fastapi",
    "gdown",
    "gradio-client>=1.4.0",
    "gunicorn",
    "numpy",
    "onnxruntime",
    "opencv-python-headless",
    "pillow",
    "python-dotenv",
    "python-multipart",
    "rembg",
    "requests",
    "tensorflow; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "tensorflow-cpu; platform_system != 'Darwin' or platform_machine != 'arm64'",
    "uvicorn[standard]",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff==0.16.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["config", "middleware", "models", "services"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
