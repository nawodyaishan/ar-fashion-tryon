name: Engineering foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_GARMENT_API_BASE: http://127.0.0.1:5100
  NEXT_PUBLIC_VTON_API_BASE: http://127.0.0.1:5100
  NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:5100
  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ''
  NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ''
  NEXT_PUBLIC_HF_TOKEN: ''

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: Read tool versions
        id: versions
        run: python3 scripts/ci-versions.py >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pnpm
        env:
          PNPM_VERSION: ${{ steps.versions.outputs.pnpm }}
        run: npm install --global "pnpm@$PNPM_VERSION"
      - name: Locate pnpm download cache
        id: pnpm-cache
        run: printf 'path=%s\n' "$(pnpm --dir web-frontend store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.node }}-${{ steps.versions.outputs.pnpm }}-${{ hashFiles('web-frontend/pnpm-lock.yaml') }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.versions.outputs.uv }}
          python-version: ${{ steps.versions.outputs.python }}
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: garment-processing-api/uv.lock
      - name: Install CI validation tools
        run: |
          make ci-tools-install TOOLS_DIR="$RUNNER_TEMP/foundation-tools"
          printf '%s\n' "$RUNNER_TEMP/foundation-tools" >> "$GITHUB_PATH"
      - name: Validate workflow
        run: make workflow-check
      - name: Install locked dependencies
        run: make setup
      - name: Verify source and isolated tests
        run: make verify
      - name: Production build
        run: make build
      - name: Install Chromium and Linux libraries explicitly
        working-directory: web-frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Mocked browser smoke
        run: make test-e2e
      - name: Confirm locks and owned source were not changed
        run: git diff --exit-code
